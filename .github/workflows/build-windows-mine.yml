name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Build
        run: cargo build --locked --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapfast-main-windows-x64
          path: target/release/zapfast.exe

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "build-${{ github.run_number }}" "target/release/zapfast.exe" --title "zapfast main build ${{ github.run_number }}" --notes "commit ${{ github.sha }}"
